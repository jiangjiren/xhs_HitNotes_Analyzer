<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI创作助手 · Apple HIG Edition</title>
  <script src="marked.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="xlsx.full.min.js" defer></script>
  <link rel="stylesheet" href="material-icons.css">
  <style>
    /* ==========================================================================
       Apple Human Interface Guidelines (HIG) Design System
       纯粹质感 · 磨砂通透 · 精致微交互 · 内容退后
       ========================================================================== */
    :root {
      /* 核心品牌色（小红书珊瑚朱红，克制使用） */
      --brand:          #ff2442;
      --brand-hover:    #e5102e;
      --brand-soft:     rgba(255, 36, 66, 0.08);
      --brand-border:   rgba(255, 36, 66, 0.20);
      --brand-ring:     rgba(255, 36, 66, 0.18);

      /* Apple Cupertino 调色板 - 浅色 */
      --bg-base:        #f5f5f7;
      --surface:        #ffffff;
      --surface-2:      #f0f0f4;
      --surface-3:      #e5e5ea;
      --surface-glass:  rgba(255, 255, 255, 0.85);
      
      --line:           rgba(0, 0, 0, 0.07);
      --line-subtle:    rgba(0, 0, 0, 0.04);
      --line-bold:      rgba(0, 0, 0, 0.12);

      --ink:            #1d1d1f;
      --ink-2:          #48484a;
      --ink-3:          #86868b;
      --ink-4:          #c7c7cc;

      /* 语义色 */
      --apple-blue:     #0071e3;
      --apple-blue-soft:rgba(0, 113, 227, 0.09);
      --ok:             #34c759;
      --ok-soft:        rgba(52, 199, 89, 0.10);
      --warn:           #ff9500;
      --warn-soft:      rgba(255, 149, 0, 0.10);
      --danger:         #ff3b30;
      --danger-soft:    rgba(255, 59, 48, 0.10);

      /* 圆角规范 */
      --r-xs:           6px;
      --r-sm:           10px;
      --r-md:           14px;
      --r-lg:           18px;
      --r-xl:           24px;
      --r-full:         999px;

      /* 阴影 */
      --sh-sm:          0 1px 3px rgba(0, 0, 0, 0.04);
      --sh-md:          0 4px 16px -4px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      --sh-lg:          0 12px 36px -8px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
      --sh-float:       0 18px 48px -10px rgba(0, 0, 0, 0.20), 0 4px 14px rgba(0, 0, 0, 0.06);

      /* 动效 */
      --ease-apple:     cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring:    cubic-bezier(0.175, 0.885, 0.32, 1.2);

      /* 字体 */
      --font-sans:      -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
      --font-mono:      "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand:          #ff375f;
        --brand-hover:    #ff5c7c;
        --brand-soft:     rgba(255, 55, 95, 0.14);
        --brand-border:   rgba(255, 55, 95, 0.28);
        --brand-ring:     rgba(255, 55, 95, 0.22);

        --bg-base:        #000000;
        --surface:        #1c1c1e;
        --surface-2:      #2c2c2e;
        --surface-3:      #3a3a3c;
        --surface-glass:  rgba(28, 28, 30, 0.88);

        --line:           rgba(255, 255, 255, 0.09);
        --line-subtle:    rgba(255, 255, 255, 0.05);
        --line-bold:      rgba(255, 255, 255, 0.16);

        --ink:            #f5f5f7;
        --ink-2:          #aeaeb2;
        --ink-3:          #8e8e93;
        --ink-4:          #48484a;

        --apple-blue:     #0a84ff;
        --apple-blue-soft:rgba(10, 132, 255, 0.16);
        --ok:             #30d158;
        --ok-soft:        rgba(48, 209, 88, 0.16);
        --warn:           #ffd60a;
        --warn-soft:      rgba(255, 214, 10, 0.16);
        --danger:         #ff453a;
        --danger-soft:    rgba(255, 69, 58, 0.16);

        --sh-sm:          0 1px 3px rgba(0, 0, 0, 0.4);
        --sh-md:          0 4px 16px -4px rgba(0, 0, 0, 0.6);
        --sh-lg:          0 12px 36px -8px rgba(0, 0, 0, 0.75);
        --sh-float:       0 18px 48px -10px rgba(0, 0, 0, 0.85);
      }
    }

    /* ---------- 全局重置与排版 ---------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      outline: none;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: var(--brand);
      text-decoration: none;
      transition: color 0.14s var(--ease-apple);
    }
    a:hover { text-decoration: underline; }

    ::selection {
      background: var(--brand-ring);
      color: var(--ink);
    }

    /* ---------- 极简苹果滚动条 ---------- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background-color: transparent;
      border-radius: var(--r-full);
      transition: background-color 0.2s var(--ease-apple);
    }
    *:hover::-webkit-scrollbar-thumb {
      background-color: var(--ink-4);
    }

    /* ==========================================================================
       1. 顶栏：极简会话导航 (Apple Minimal Header)
       ========================================================================== */
    .app-header {
      flex-shrink: 0;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
    }

    /* 当前会话胶囊 */
    .session-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: var(--r-full);
      background: var(--surface-2);
      font-size: 12.5px;
      font-weight: 550;
      color: var(--ink);
      max-width: 220px;
      transition: all 0.16s var(--ease-apple);
    }

    .session-pill-btn:hover {
      background: var(--surface-3);
    }

    .session-pill-btn:active {
      transform: scale(0.97);
    }

    .session-pill-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-pill-btn .material-icons {
      font-size: 15px;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 苹果级图标按钮 */
    .apple-icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-sm);
      color: var(--ink-2);
      background: transparent;
      transition: all 0.15s var(--ease-apple);
    }

    .apple-icon-btn:hover {
      background-color: var(--surface-2);
      color: var(--ink);
    }

    .apple-icon-btn:active {
      transform: scale(0.92);
    }

    .apple-icon-btn .material-icons {
      font-size: 18px;
    }

    .apple-icon-btn svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    /* ==========================================================================
       2. 主视口与容器
       ========================================================================== */
    .app-viewport {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 42px);
      position: relative;
      overflow: hidden;
    }

    .chat-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px 16px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      user-select: text;
    }

    /* ==========================================================================
       3. 智能情境横幅 (Context-Aware Intelligence Banner)
       ========================================================================== */
    .context-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--sh-sm);
      animation: bannerSlideIn 0.35s var(--ease-spring) both;
    }

    .context-banner.show {
      display: flex;
    }

    @keyframes bannerSlideIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .context-banner-main {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .context-banner-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--r-xs);
      background: var(--brand-soft);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .context-banner-icon .material-icons {
      font-size: 17px;
    }

    .context-banner-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .context-banner-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .context-banner-desc {
      font-size: 11px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .context-banner-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .context-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--r-full);
      font-size: 11.5px;
      font-weight: 600;
      background: var(--brand);
      color: #ffffff;
      transition: all 0.16s var(--ease-apple);
    }

    .context-action-btn:hover {
      background: var(--brand-hover);
      transform: translateY(-0.5px);
    }

    .context-action-btn:active {
      transform: scale(0.95);
    }

    .context-dismiss-btn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-full);
      color: var(--ink-4);
      transition: all 0.15s var(--ease-apple);
    }

    .context-dismiss-btn:hover {
      color: var(--ink-2);
      background: var(--surface-2);
    }

    .context-dismiss-btn .material-icons { font-size: 15px; }

    /* ==========================================================================
       4. 灵动采集进度胶囊 (Dynamic Island Collection Indicator)
       ========================================================================== */
    .collect-progress-capsule {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      margin-bottom: 12px;
      border-radius: var(--r-full);
      background: var(--ink);
      color: var(--bg-base);
      box-shadow: var(--sh-md);
      position: sticky;
      top: 0;
      z-index: 30;
      animation: capsuleIn 0.3s var(--ease-spring) both;
    }

    .collect-progress-capsule.active {
      display: flex;
    }

    @keyframes capsuleIn {
      from { opacity: 0; transform: scale(0.94) translateY(-10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .capsule-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .capsule-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      animation: capsuleBreathe 1.5s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes capsuleBreathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.5; }
    }

    .capsule-text {
      font-size: 12px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .capsule-stop-btn {
      padding: 2px 8px;
      border-radius: var(--r-full);
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.15s var(--ease-apple);
    }

    .capsule-stop-btn:hover {
      background: rgba(255, 255, 255, 0.32);
    }

    /* ==========================================================================
       5. 欢迎引导屏 (Welcome Empty State)
       ========================================================================== */
    .welcome {
      display: flex;
      flex-direction: column;
      padding: 18px 2px 10px;
    }

    .welcome-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      padding: 3px 9px;
      border-radius: var(--r-full);
      margin-bottom: 12px;
    }

    .welcome-title {
      margin: 0 0 6px;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    .welcome-sub {
      margin: 0 0 16px;
      font-size: 12.5px;
      color: var(--ink-3);
    }

    .welcome-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .welcome-card {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--sh-sm);
      transition: all 0.18s var(--ease-apple);
    }

    .welcome-card:hover {
      border-color: var(--brand-border);
      transform: translateY(-1px);
      box-shadow: var(--sh-md);
    }

    .welcome-card:active {
      transform: scale(0.985);
    }

    .welcome-card .material-icons {
      font-size: 18px;
      color: var(--brand);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .welcome-card-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .welcome-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .welcome-card-desc {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-3);
    }

    /* 入场动画 */
    .welcome > * { animation: riseUp 0.35s var(--ease-apple) both; }
    .welcome > *:nth-child(1) { animation-delay: 0.02s; }
    .welcome > *:nth-child(2) { animation-delay: 0.05s; }
    .welcome > *:nth-child(3) { animation-delay: 0.08s; }
    .welcome-card:nth-child(1) { animation-delay: 0.12s; }
    .welcome-card:nth-child(2) { animation-delay: 0.16s; }
    .welcome-card:nth-child(3) { animation-delay: 0.20s; }
    .welcome-card:nth-child(4) { animation-delay: 0.24s; }

    @keyframes riseUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       6. 消息流与卡片 (Messages & Streaming)
       ========================================================================== */
    .message {
      margin-bottom: 16px;
      box-sizing: border-box;
      max-width: 100%;
      word-wrap: break-word;
      word-break: break-word;
      animation: msgIn 0.28s var(--ease-apple) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 用户气泡 */
    .user-message {
      width: fit-content;
      max-width: 88%;
      margin-left: auto;
      margin-right: 0;
      padding: 9px 13px;
      background: var(--brand);
      color: #ffffff;
      border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
      font-size: 13.5px;
      white-space: pre-wrap;
      box-shadow: 0 1px 3px rgba(255, 36, 66, 0.22);
    }

    /* AI 回答 */
    .ai-message {
      margin-left: 0;
      margin-right: 0;
      padding: 0;
      background: none;
      color: var(--ink);
      font-size: 13.5px;
      white-space: normal;
      position: relative;
    }

    .ai-message-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--brand);
    }

    .ai-message-header .material-icons { font-size: 14px; }

    /* 复制按钮 */
    .copy-button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 3px 8px;
      background-color: var(--surface);
      color: var(--ink-3);
      border: 1px solid var(--line);
      border-radius: var(--r-full);
      font-size: 11px;
      opacity: 0;
      transition: all 0.16s var(--ease-apple);
    }

    .ai-message:hover .copy-button,
    .copy-button:focus-visible { opacity: 1; }

    .copy-button:hover {
      background-color: var(--surface-2);
      color: var(--ink);
    }

    .copy-button .material-icons { font-size: 13px; }

    .copy-success {
      opacity: 1 !important;
      color: var(--ok) !important;
      border-color: var(--ok) !important;
    }

    /* 思考中占位 */
    .thinking-message {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      width: fit-content;
      position: relative;
      overflow: hidden;
    }

    .thinking-text {
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
    }

    .thinking-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--brand);
      margin: 0 1.5px;
      animation: bounceDot 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0s; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    /* DeepSeek 推理过程折叠块 */
    .deepseek-reasoning-message {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: var(--ink-2);
      font-size: 12px;
      line-height: 1.55;
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .deepseek-reasoning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      user-select: none;
    }

    .deepseek-reasoning-title {
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .deepseek-reasoning-toggle {
      width: 20px;
      height: 20px;
      border-radius: var(--r-xs);
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s var(--ease-apple);
      pointer-events: none;
    }

    .deepseek-reasoning-toggle:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    .deepseek-reasoning-toggle .material-icons { font-size: 15px; }

    .deepseek-reasoning-body {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .deepseek-reasoning-message.collapsed .deepseek-reasoning-header { margin-bottom: 0; }
    .deepseek-reasoning-message.collapsed .deepseek-reasoning-body { display: none; }

    /* 后续推荐行动胶囊 (Smart Follow-up Pills) */
    .followup-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      animation: riseUp 0.3s var(--ease-apple) both;
    }

    .followup-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: var(--r-full);
      background: var(--surface);
      border: 1px solid var(--line-bold);
      color: var(--ink-2);
      font-size: 11.5px;
      font-weight: 500;
      transition: all 0.16s var(--ease-apple);
    }

    .followup-pill:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-soft);
      transform: translateY(-0.5px);
    }

    .followup-pill:active { transform: scale(0.96); }

    /* 网页内容预览卡片 */
    .page-content-preview {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      margin-bottom: 16px;
      padding: 12px;
      box-shadow: var(--sh-sm);
      animation: msgIn 0.28s var(--ease-apple) both;
    }

    .page-preview-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--brand);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .page-preview-header .material-icons { font-size: 15px; }

    .page-preview-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .page-title-link {
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
      transition: color 0.15s var(--ease-apple);
    }
    .page-title-link:hover { color: var(--brand); text-decoration: underline; }

    .page-source, .page-author {
      color: var(--ink-3);
      font-size: 11px;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .page-actions button {
      background-color: var(--surface-2);
      color: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-full);
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 550;
      transition: all 0.15s var(--ease-apple);
    }

    .page-actions button:hover {
      background-color: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
      transform: translateY(-0.5px);
    }

    /* ==========================================================================
       7. Markdown 排版
       ========================================================================== */
    .markdown-body {
      line-height: 1.65;
      color: var(--ink);
      word-break: break-word;
    }

    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child  { margin-bottom: 0; }
    .markdown-body p { margin: 0.5em 0; }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      margin: 1.1em 0 0.4em;
      line-height: 1.35;
      font-weight: 680;
      color: var(--ink);
    }

    .markdown-body h1 { font-size: 1.25em; padding-left: 8px; border-left: 3px solid var(--brand); }
    .markdown-body h2 { font-size: 1.15em; padding-left: 8px; border-left: 3px solid var(--brand); }
    .markdown-body h3 { font-size: 1.05em; }

    .markdown-body ul, .markdown-body ol {
      margin: 0.6em 0;
      padding-left: 1.4em;
    }
    .markdown-body li { margin: 0.25em 0; }
    .markdown-body li::marker { color: var(--brand); }

    .markdown-body code {
      background-color: var(--surface-2);
      border: 1px solid var(--line);
      padding: 0.1em 0.35em;
      border-radius: var(--r-xs);
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: var(--brand);
    }

    .markdown-body pre {
      background-color: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px;
      overflow-x: auto;
      margin: 0.8em 0;
      font-size: 12px;
    }
    .markdown-body pre code { background: none; border: none; padding: 0; color: var(--ink); }

    .markdown-body blockquote {
      border-left: 3px solid var(--line-bold);
      margin: 0.8em 0;
      padding: 0.3em 0 0.3em 0.8em;
      color: var(--ink-2);
    }

    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.8em 0;
      font-size: 12px;
      display: block;
      overflow-x: auto;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--line);
      padding: 6px 8px;
    }
    .markdown-body th { background: var(--surface-2); font-weight: 600; }

    .message-image {
      max-width: 180px;
      max-height: 180px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      margin-top: 6px;
      display: block;
    }

    /* ==========================================================================
       8. 全能输入舱 (The Apple Omnibar)
       ========================================================================== */
    .omnibar-container {
      flex-shrink: 0;
      padding: 6px 10px 8px;
      background: var(--surface-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--line);
      position: relative;
      z-index: 40;
    }

    .omnibar-card {
      background: var(--surface);
      border: 1.5px solid var(--line-bold);
      border-radius: var(--r-md);
      padding: 7px 10px 6px;
      box-shadow: var(--sh-xs);
      transition: all 0.2s var(--ease-apple);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .omnibar-card:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-ring), var(--sh-sm);
      background: var(--surface);
    }

    /* 文本输入区域 */
    .omnibar-textarea {
      width: 100%;
      min-height: 34px;
      height: 34px;
      max-height: 130px;
      resize: none;
      font-size: 13.5px;
      line-height: 22px;
      padding: 1px 2px;
      color: var(--ink);
      user-select: text;
    }

    .omnibar-textarea::placeholder {
      color: var(--ink-4);
    }

    /* 附件悬浮展示区 (多图列表，位于 Omnibar 输入框上方) */
    .omnibar-attachment-shelf {
      display: flex;
      margin-bottom: 6px;
      animation: attachmentPop 0.22s var(--ease-apple);
    }

    @keyframes attachmentPop {
      0% { opacity: 0; transform: translateY(6px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .attachment-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      max-height: 120px;
      overflow-y: auto;
      padding: 2px 0;
    }

    .attachment-item {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .attachment-item .file-thumb {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      border: 1px solid var(--line-bold);
      box-shadow: var(--sh-xs);
      background: var(--surface-2);
    }

    .attachment-item .attachment-text-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--surface);
      border: 1px solid var(--line-bold);
      border-radius: var(--r-md);
      font-size: 11px;
      color: var(--ink-2);
      max-width: 160px;
      box-shadow: var(--sh-xs);
    }

    .attachment-item .attachment-text-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-item .attachment-remove-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.22);
      transition: all 0.15s var(--ease-apple);
      border: 1.5px solid var(--surface);
    }
    .attachment-item .attachment-remove-btn:hover {
      background: var(--danger);
      transform: scale(1.15);
    }
    .attachment-item .attachment-remove-btn .material-icons {
      font-size: 12px;
    }

    /* Omnibar 底部控制栏 */
    .omnibar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 2px;
    }

    .omnibar-controls-left {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .omnibar-controls-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 胶囊控制按钮 (Pill Button) */
    .capsule-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: var(--r-full);
      background: var(--surface-2);
      font-size: 11.5px;
      font-weight: 550;
      color: var(--ink-2);
      transition: all 0.15s var(--ease-apple);
      max-width: 220px;
    }

    .capsule-btn:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    .capsule-btn:active {
      transform: scale(0.96);
    }

    .capsule-btn.open {
      background: var(--surface-3);
      color: var(--ink);
    }

    .capsule-btn-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .capsule-btn .material-icons {
      font-size: 14px;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    /* 思考深度小微章 */
    .thinking-tag {
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--apple-blue-soft);
      color: var(--apple-blue);
      letter-spacing: 0.02em;
    }

    .thinking-tag.disabled {
      display: none;
    }

    /* 采集胶囊按钮 */
    .collect-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      border-radius: var(--r-full);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand);
      font-size: 11.5px;
      font-weight: 600;
      transition: all 0.15s var(--ease-apple);
    }

    .collect-pill-btn:hover {
      background: var(--brand-ring);
    }

    .collect-pill-btn:active {
      transform: scale(0.96);
    }

    .collect-pill-btn .material-icons { font-size: 15px; }

    /* 圆形发送/停止按钮 */
    .omnibar-send-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--brand);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s var(--ease-spring);
    }

    .omnibar-send-btn:hover {
      background: var(--brand-hover);
      transform: scale(1.05);
    }

    .omnibar-send-btn:active {
      transform: scale(0.92);
    }

    .omnibar-send-btn .material-icons { font-size: 16px; }

    .omnibar-send-btn.stop-mode {
      background: var(--ink);
    }
    .omnibar-send-btn.stop-mode:hover {
      background: var(--ink-2);
    }

    /* ==========================================================================
       9. 弹出菜单与气泡面板 (Apple Glass Popovers)
       ========================================================================== */
    .popmenu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      min-width: 215px;
      max-height: 360px;
      overflow-y: auto;
      padding: 6px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: var(--sh-lg);
      z-index: 100;
      display: none;
      animation: popoverIn 0.18s var(--ease-spring) both;
    }

    .popmenu.open { display: block; }

    @keyframes popoverIn {
      from { opacity: 0; transform: translateY(6px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .popmenu-header-label {
      padding: 6px 8px 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      text-transform: uppercase;
    }

    .popmenu-divider {
      height: 1px;
      margin: 4px 2px;
      background: var(--line);
    }

    .popmenu-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 7px 8px;
      border-radius: var(--r-sm);
      font-size: 12.5px;
      color: var(--ink);
      transition: background 0.12s var(--ease-apple);
    }

    .popmenu-option:hover {
      background-color: var(--surface-2);
    }

    .popmenu-option .material-icons {
      font-size: 17px;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .popmenu-option-body {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      flex: 1;
    }

    .popmenu-option-desc {
      font-size: 10.5px;
      color: var(--ink-3);
    }

    .popmenu-option-check {
      font-size: 15px !important;
      color: var(--brand) !important;
      flex-shrink: 0;
      visibility: hidden;
    }

    .popmenu-option.checked .popmenu-option-check {
      visibility: visible;
    }
    .popmenu-option.checked {
      font-weight: 600;
    }

    /* 采集配置快速面板 */
    .collect-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 12px;
      width: 250px;
      padding: 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: var(--sh-lg);
      z-index: 100;
      display: none;
      animation: popoverIn 0.18s var(--ease-spring) both;
    }

    .collect-panel.open { display: block; }

    .collect-panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .collect-fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .collect-field label {
      display: block;
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }

    .collect-field input {
      width: 100%;
      padding: 6px 8px;
      border-radius: var(--r-xs);
      border: 1px solid var(--line-bold);
      background: var(--surface);
      font-size: 12.5px;
      color: var(--ink);
    }

    .collect-field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px var(--brand-ring);
    }

    .collect-checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--ink-2);
      margin-bottom: 12px;
      cursor: pointer;
    }

    .apple-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--line-bold);
      background: var(--surface);
      cursor: pointer;
      position: relative;
      transition: all 0.14s var(--ease-apple);
    }

    .apple-checkbox:checked {
      background: var(--brand);
      border-color: var(--brand);
    }

    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* 按钮通用 */
    .apple-btn {
      padding: 8px 14px;
      border-radius: var(--r-sm);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s var(--ease-apple);
    }

    .apple-btn-primary {
      background: var(--brand);
      color: #ffffff;
    }
    .apple-btn-primary:hover { background: var(--brand-hover); }
    .apple-btn-primary:active { transform: scale(0.97); }

    .apple-btn-secondary {
      background: var(--surface-2);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .apple-btn-secondary:hover { background: var(--surface-3); }
    .apple-btn-secondary:active { transform: scale(0.97); }

    /* ==========================================================================
       10. 抽屉系统 (Apple Bottom Sheets)
       ========================================================================== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: opacity 0.24s var(--ease-apple);
    }

    .sheet-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .sheet-modal {
      width: 100%;
      max-height: 85vh;
      background: var(--surface-glass);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-top-left-radius: var(--r-xl);
      border-top-right-radius: var(--r-xl);
      border-top: 1px solid var(--line);
      box-shadow: var(--sh-float);
      padding: 14px 16px 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      transition: transform 0.28s var(--ease-spring);
    }

    .sheet-overlay.hidden .sheet-modal {
      transform: translateY(100%);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: var(--r-full);
      background: var(--ink-4);
      margin: 0 auto 10px;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 680;
      color: var(--ink);
    }

    .sheet-close-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--r-full);
      background: var(--surface-2);
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.15s var(--ease-apple);
    }
    .sheet-close-btn:hover { background: var(--surface-3); color: var(--ink); }

    .sheet-desc {
      font-size: 11.5px;
      color: var(--ink-3);
      margin-bottom: 12px;
    }

    .sheet-body {
      overflow-y: auto;
      max-height: 60vh;
      margin: 0 -4px;
      padding: 0 4px;
    }

    /* 设置表单 */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 5px;
    }

    .apple-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line-bold);
      background: var(--surface);
      font-size: 13px;
      color: var(--ink);
      transition: all 0.15s var(--ease-apple);
    }

    .apple-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-ring);
    }

    .form-group small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--ink-3);
    }

    .sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sheet-footer .apple-btn { flex: 1; }

    /* 历史列表项 */
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--r-sm);
      border-bottom: 1px solid var(--line-subtle);
      transition: background 0.15s var(--ease-apple);
    }
    .history-item:hover { background: var(--surface-2); }

    .history-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .history-title {
      font-size: 12.5px;
      font-weight: 550;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .history-date {
      font-size: 10.5px;
      color: var(--ink-3);
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s var(--ease-apple);
    }
    .history-item:hover .history-actions { opacity: 1; }

    .history-action-btn, .delete-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--r-xs);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      transition: all 0.15s var(--ease-apple);
    }
    .history-action-btn:hover { background: var(--surface-3); color: var(--ink); }
    .delete-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .history-action-btn .material-icons, .delete-btn .material-icons { font-size: 15px; }

    .no-history {
      text-align: center;
      color: var(--ink-4);
      padding: 30px 10px;
      font-size: 12.5px;
    }

    /* 指令列表项 */
    .instruction-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-radius: var(--r-sm);
      border-bottom: 1px solid var(--line-subtle);
      transition: background 0.14s var(--ease-apple);
    }
    .instruction-item:hover { background: var(--surface-2); }

    .instruction-item label {
      flex: 1;
      font-size: 12.5px;
      color: var(--ink);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .instruction-buttons {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.14s var(--ease-apple);
    }
    .instruction-item:hover .instruction-buttons { opacity: 1; }

    .instruction-buttons button {
      width: 24px;
      height: 24px;
      border-radius: var(--r-xs);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--ink-3);
    }
    .instruction-buttons button:hover { background: var(--surface-3); color: var(--ink); }
    .instruction-buttons .delete-btn:hover { background: var(--danger-soft); color: var(--danger); }

    #add-instruction-form {
      margin-top: 10px;
      padding: 10px;
      border-radius: var(--r-md);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    #add-instruction-form input, #add-instruction-form textarea {
      margin-bottom: 8px;
      background: var(--surface);
    }

    /* ==========================================================================
       11. 浮动 Toast (Apple Pill Toast)
       ========================================================================== */
    .toast {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translate(-50%, -8px);
      background: var(--ink);
      color: var(--bg-base);
      padding: 7px 14px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 550;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      box-shadow: var(--sh-md);
      transition: all 0.22s var(--ease-spring);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ================= 顶栏：极简会话导航 ================= -->
  <header class="app-header">
    <div class="header-left">
      <!-- 当前会话选择胶囊 -->
      <button type="button" id="sessionPillBtn" class="session-pill-btn" title="点击查看最近会话">
        <span class="material-icons">chat_bubble_outline</span>
        <span id="headerSessionTitle" class="session-pill-title">新建对话</span>
        <span class="material-icons">expand_more</span>
      </button>
    </div>
    
    <div class="header-right">
      <!-- 新建对话 -->
      <button type="button" id="newChatBtn" class="apple-icon-btn" title="新建对话">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>

      <!-- 更多操作菜单 -->
      <div style="position: relative;">
        <button type="button" id="moreMenuBtn" class="apple-icon-btn" title="更多选项" aria-haspopup="menu" aria-expanded="false">
          <span class="material-icons">more_horiz</span>
        </button>
        <div id="moreMenu" class="popmenu" style="right: 0; left: auto; top: calc(100% + 6px); bottom: auto;" role="menu">
          <button type="button" class="popmenu-option" id="settingsTabBtn" role="menuitem">
            <span class="material-icons">settings</span>
            <span class="popmenu-option-body">
              <span>API 密钥设置</span>
              <span class="popmenu-option-desc">配置 DeepSeek / Gemini Key</span>
            </span>
          </button>
          <button type="button" class="popmenu-option" id="show-hide-instructions-btn" role="menuitem">
            <span class="material-icons">auto_awesome</span>
            <span class="popmenu-option-body">
              <span>自定义人设与指令</span>
              <span class="popmenu-option-desc">预设 System Prompt 规则</span>
            </span>
          </button>
          <button type="button" class="popmenu-option" id="historyBtn" role="menuitem">
            <span class="material-icons">history</span>
            <span class="popmenu-option-body">
              <span>历史对话记录</span>
              <span class="popmenu-option-desc">查看与管理历史记录</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= 主视口 ================= -->
  <main class="app-viewport">

    <!-- 滚动消息区域 -->
    <div id="chatMessages" class="chat-scroll-area">
      
      <!-- 智能情境横幅（根据当前浏览标签自动切换） -->
      <div id="contextBanner" class="context-banner">
        <div class="context-banner-main">
          <div class="context-banner-icon" id="contextBannerIcon">
            <span class="material-icons">bolt</span>
          </div>
          <div class="context-banner-text">
            <div id="contextBannerTitle" class="context-banner-title">小红书爆款嗅探</div>
            <div id="contextBannerDesc" class="context-banner-desc">检测到搜索页，可一键采集前10篇高赞笔记</div>
          </div>
        </div>
        <div class="context-banner-actions">
          <button type="button" id="contextActionBtn" class="context-action-btn">
            <span>立即采集</span>
          </button>
          <button type="button" id="contextDismissBtn" class="context-dismiss-btn" title="忽略">
            <span class="material-icons">close</span>
          </button>
        </div>
      </div>

      <!-- 灵动采集胶囊进度条 -->
      <div id="collectCapsule" class="collect-progress-capsule">
        <div class="capsule-left">
          <span class="capsule-dot"></span>
          <span id="capsuleStatusText" class="capsule-text">正在采集中...</span>
        </div>
        <button type="button" id="capsuleStopBtn" class="capsule-stop-btn">
          <span class="material-icons" style="font-size:12px;">stop</span>
          <span>停止</span>
        </button>
      </div>

    </div>

    <!-- ================= 8. 全能输入舱 (The Omnibar) ================= -->
    <div class="omnibar-container">
      
      <!-- 隐藏状态保留项（兼容现有 background 存储结构） -->
      <select id="modelSwitcher" hidden>
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
      </select>
      <select id="deepseekThinkingEffort" hidden>
        <option value="disabled">Off</option>
        <option value="low">Low</option>
        <option value="mid">Mid</option>
        <option value="high" selected>High</option>
        <option value="max">Max</option>
      </select>
      <input type="file" id="fileInput" multiple accept=".txt,text/plain,image/png,image/jpeg,image/webp,image/gif" style="display: none;">

      <!-- 采集面板 (浮层) -->
      <div id="collectToolPanel" class="collect-panel">
        <div class="collect-panel-title">
          <span class="material-icons" style="font-size:16px;">travel_explore</span>
          <span>小红书爆款采集参数</span>
        </div>
        <div class="collect-fields-grid">
          <div class="collect-field">
            <label for="maxNotes">采集数量</label>
            <input type="number" id="maxNotes" value="10" min="1">
          </div>
          <div class="collect-field">
            <label for="minLikes">最低点赞</label>
            <input type="number" id="minLikes" value="500" min="0">
          </div>
        </div>
        <label class="collect-checkbox-row" for="downloadCover">
          <input type="checkbox" id="downloadCover" class="apple-checkbox">
          <span>同时下载封面大图</span>
        </label>
        <button id="collectBtn" class="apple-btn apple-btn-primary" style="width: 100%;">
          <span class="material-icons" style="font-size:16px;">play_arrow</span>
          <span>开始采集</span>
        </button>
        <div id="status" style="display:none; font-size:11px; color:var(--ink-3); margin-top:8px;">
          <span></span>
        </div>
      </div>

      <!-- 附件悬浮展示架 (支持多图与文件列表) -->
      <div id="fileInfo" class="omnibar-attachment-shelf" style="display: none;">
        <div id="attachmentList" class="attachment-list"></div>
      </div>

      <!-- 统一 Omnibar 卡片 -->
      <div class="omnibar-card">
        
        <!-- 文本输入区 -->
        <textarea id="messageInput" class="omnibar-textarea" rows="1"
          placeholder="问点什么，或粘贴小红书链接 / 拖入图片..."></textarea>

        <!-- 底部控制栏 -->
        <div class="omnibar-controls">
          <div class="omnibar-controls-left">
            
            <!-- 附件 + 菜单 -->
            <div style="position: relative;">
              <button type="button" id="attachBtn" class="apple-icon-btn" style="width:24px; height:24px;" title="添加内容" aria-haspopup="menu" aria-expanded="false">
                <span class="material-icons" style="font-size:19px;">add_circle_outline</span>
              </button>
              <div id="attachMenu" class="popmenu" role="menu">
                <button type="button" class="popmenu-option" id="attachUploadBtn" role="menuitem">
                  <span class="material-icons">image</span>
                  <span class="popmenu-option-body">
                    <span>上传图片或文件</span>
                    <span class="popmenu-option-desc">PNG / JPG / WebP / TXT</span>
                  </span>
                </button>
                <button type="button" class="popmenu-option" id="getPageContentBtn" role="menuitem">
                  <span class="material-icons">description</span>
                  <span class="popmenu-option-body">
                    <span>读取当前网页</span>
                    <span class="popmenu-option-desc">将正在浏览的页面喂给 AI</span>
                  </span>
                </button>
              </div>
            </div>

            <!-- 模型与思考深度联合胶囊 -->
            <div style="position: relative;">
              <button type="button" id="modelMenuBtn" class="capsule-btn" aria-haspopup="menu" aria-expanded="false" title="切换模型与思考深度">
                <span id="modelMenuLabel" class="capsule-btn-label">DeepSeek V4 Flash</span>
                <span id="thinkingTagBadge" class="thinking-tag">High</span>
                <span class="material-icons">expand_more</span>
              </button>
              
              <!-- 联合菜单：包含模型与思考深度 -->
              <div id="modelMenu" class="popmenu" role="menu">
                <div class="popmenu-header-label">模型选择 (Model)</div>
                <button type="button" class="popmenu-option" role="menuitemradio" data-model="deepseek-v4-flash">
                  <span class="material-icons popmenu-option-check">check</span>
                  <span class="popmenu-option-body">
                    <span>DeepSeek V4 Flash</span>
                  </span>
                </button>
                <button type="button" class="popmenu-option" role="menuitemradio" data-model="deepseek-v4-pro">
                  <span class="material-icons popmenu-option-check">check</span>
                  <span class="popmenu-option-body">
                    <span>DeepSeek V4 Pro</span>
                  </span>
                </button>
                <button type="button" class="popmenu-option" role="menuitemradio" data-model="gemini-3.7-flash">
                  <span class="material-icons popmenu-option-check">check</span>
                  <span class="popmenu-option-body">
                    <span>Gemini 3.7 Flash</span>
                  </span>
                </button>
                <button type="button" class="popmenu-option" role="menuitemradio" data-model="gemini-3.1-pro-preview">
                  <span class="material-icons popmenu-option-check">check</span>
                  <span class="popmenu-option-body">
                    <span>Gemini 3.1 Pro</span>
                  </span>
                </button>

                <!-- 思考深度分组 -->
                <div id="thinkingSection">
                  <div class="popmenu-divider"></div>
                  <div class="popmenu-header-label">Thinking Effort</div>
                  <button type="button" class="popmenu-option" role="menuitemradio" data-effort="disabled">
                    <span class="material-icons popmenu-option-check">check</span>
                    <span class="popmenu-option-body">
                      <span>Off</span>
                    </span>
                  </button>
                  <button type="button" class="popmenu-option" role="menuitemradio" data-effort="low">
                    <span class="material-icons popmenu-option-check">check</span>
                    <span class="popmenu-option-body">
                      <span>Low</span>
                    </span>
                  </button>
                  <button type="button" class="popmenu-option" role="menuitemradio" data-effort="mid">
                    <span class="material-icons popmenu-option-check">check</span>
                    <span class="popmenu-option-body">
                      <span>Mid</span>
                    </span>
                  </button>
                  <button type="button" class="popmenu-option" role="menuitemradio" data-effort="high">
                    <span class="material-icons popmenu-option-check">check</span>
                    <span class="popmenu-option-body">
                      <span>High</span>
                    </span>
                  </button>
                  <button type="button" class="popmenu-option" role="menuitemradio" data-effort="max">
                    <span class="material-icons popmenu-option-check">check</span>
                    <span class="popmenu-option-body">
                      <span>Max</span>
                    </span>
                  </button>
                </div>
              </div>
            </div>

            <!-- 采集快捷按钮 -->
            <button type="button" id="collectToolBtn" class="collect-pill-btn" title="采集小红书爆款笔记">
              <span class="material-icons">travel_explore</span>
              <span>采集</span>
            </button>

          </div>

          <!-- 右侧：发送/停止按钮 -->
          <div class="omnibar-controls-right">
            <button type="button" id="sendMessage" class="omnibar-send-btn" title="发送 (Enter)">
              <span class="material-icons">arrow_upward</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- ================= 抽屉：API 密钥设置 ================= -->
  <div id="settings-modal-overlay" class="sheet-overlay hidden">
    <div id="settings-container" class="sheet-modal">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">API 密钥设置</div>
        <button type="button" id="close-settings-btn" class="sheet-close-btn">&times;</button>
      </div>
      <div class="sheet-desc">密钥仅安全保存在本地浏览器 Storage 中，不经过任何中转服务器</div>
      
      <div class="sheet-body">
        <div class="form-group">
          <label for="apiKey">DeepSeek API Key</label>
          <input type="password" id="apiKey" class="apple-input" placeholder="sk-..." autocomplete="off">
          <small>用于 DeepSeek V4 Flash / Pro 模型及深度思考</small>
        </div>
        <div class="form-group">
          <label for="geminiApiKey">Gemini API Key</label>
          <input type="password" id="geminiApiKey" class="apple-input" placeholder="AIza..." autocomplete="off">
          <small>用于 Gemini 3.7 Flash / 3.1 Pro 模型及图片分析</small>
        </div>
      </div>

      <div class="sheet-footer">
        <button type="button" id="cancel-settings-btn" class="apple-btn apple-btn-secondary">取消</button>
        <button type="button" id="save-settings-btn" class="apple-btn apple-btn-primary">保存设置</button>
      </div>
    </div>
  </div>

  <!-- ================= 抽屉：自定义指令 ================= -->
  <div id="instructions-modal-overlay" class="sheet-overlay hidden">
    <div id="instructions-container" class="sheet-modal">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">自定义人设与指令</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" id="add-new-instruction-btn" class="apple-btn apple-btn-primary" style="padding:4px 10px; font-size:11.5px;">+ 新建指令</button>
          <button type="button" id="close-instructions-btn" class="sheet-close-btn">&times;</button>
        </div>
      </div>
      <div class="sheet-desc">选中的指令会作为 System Prompt 注入，让 AI 按专属风格回答</div>

      <div class="sheet-body">
        <div id="instructions-list"></div>
        <div id="add-instruction-form" class="hidden">
          <input type="hidden" id="instruction-edit-id">
          <input type="text" id="instruction-name" class="apple-input" placeholder="指令名称 (如: 毒舌美妆博主)">
          <textarea id="instruction-prompt" class="apple-input" rows="4" placeholder="系统提示词内容（设定AI的语气、格式或要求）" maxlength="10000"></textarea>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" id="save-instruction-btn" class="apple-btn apple-btn-primary" style="flex:1;">保存</button>
            <button type="button" id="cancel-add-btn" class="apple-btn apple-btn-secondary" style="flex:1;">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 抽屉：历史对话 ================= -->
  <div id="historyModal" class="sheet-overlay hidden">
    <div class="sheet-modal">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">历史对话记录</div>
        <button type="button" id="closeHistoryModal" class="sheet-close-btn">&times;</button>
      </div>
      <div class="sheet-desc">点击会话可直接切换，支持重命名与删除</div>
      <div class="sheet-body" id="historyList"></div>
    </div>
  </div>

  <!-- ================= Toast 浮动提示 ================= -->
  <div id="toast" class="toast">操作成功</div>

  <script src="popup.js" defer></script>
  <script src="fixed_function.js"></script>
</body>
</html>
